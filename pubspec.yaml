name: user_management_app
description: "A Flutter application that fetches and displays users from the ReqRes API with pagination, infinite scrolling, search, caching, pull-to-refresh, error handling, and user details.."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  dio: ^5.11.1
  get_it: ^9.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  internet_connection_checker_plus: ^3.1.2


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:

  uses-material-design: true

